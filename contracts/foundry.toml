[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
via_ir = true
evm_version = "cancun"
# @forshtat/hegota-support is an npm dependency of the workshop (installed in the repo root)
remappings = ["@forshtat/hegota-support/=../node_modules/@forshtat/hegota-support/"]
# solc may only read inside the project unless told otherwise; the library lives in the repo root's node_modules
allow_paths = ["../node_modules"]
